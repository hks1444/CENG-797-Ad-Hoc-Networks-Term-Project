[General]
network = src.AodvRealAdhoc5
sim-time-limit = 40s

*.host[*].ipv4.arp.typename = "GlobalArp"

*.host[0].numApps = 2
*.host[0].app[0].typename = "UdpBasicApp"
*.host[0].app[0].destAddresses = "host[4]"
*.host[0].app[0].destPort = 5000
*.host[0].app[0].messageLength = 1000B
*.host[0].app[0].sendInterval = 1000ms
*.host[0].app[0].packetName = "UDPData"

*.host[24].numApps = 2
*.host[24].app[0].typename = "UdpSink"
*.host[24].app[0].localPort = 5000

*.host[0].app[1].typename = "src.cluster.ClusterApp"
*.host[0].app[1].localPort = 4000
*.host[0].app[1].destPort  = 4000
*.host[0].app[1].destAddress = "10.0.0.5"
*.host[0].app[1].helloInterval = 1s
*.host[0].app[1].cfInterval    = 3s
*.host[0].app[1].hldTimeThreshold = 1s
*.host[0].app[1].maxTrials = 3
*.host[0].app[1].requestTimeout = 1s
*.host[0].app[1].maxClusterSize = 10

*.host[24].app[1].typename = "src.cluster.ClusterApp"
*.host[24].app[1].localPort = 4000
*.host[24].app[1].destPort  = 4000
*.host[24].app[1].destAddress = "10.0.0.5"
*.host[24].app[1].helloInterval = 1s
*.host[24].app[1].cfInterval    = 3s
*.host[24].app[1].hldTimeThreshold = 1s
*.host[24].app[1].maxTrials = 3
*.host[24].app[1].requestTimeout = 1s
*.host[24].app[1].maxClusterSize = 10

# important: num retries * timeout must be smaller than cf_time otherwise error
 
*.host[1..23].numApps = 1
*.host[1..23].app[0].typename = "src.cluster.ClusterApp"
*.host[1..23].app[0].localPort = 4000
*.host[1..23].app[0].destPort  = 4000
*.host[1..23].app[0].destAddress = "10.0.0.5"
*.host[1..23].app[0].helloInterval = 1s
*.host[1..23].app[0].cfInterval    = 3s
*.host[1..23].app[0].hldTimeThreshold = 1s
*.host[1..23].app[0].maxTrials = 3
*.host[1..23].app[0].requestTimeout = 1s
*.host[1..23].app[0].maxClusterSize = 10

*.host[*].typename = "AodvRouterWithMetrics"
**.metrics.samplePeriod = 0.5s
**.metrics.recordPerUtility = true
*.host[*].wlan[0].typename = "WirelessInterface"
*.host[*].wlan[0].radio.typename = "UnitDiskRadio"
*.host[*].wlan[0].mac.typename = "CsmaCaMac"
*.host[*].wlan[0].mac.ackTimeout = 300us
*.host[*].wlan[0].queue.typename = "DropTailQueue"
*.host[*].wlan[0].queue.packetCapacity = 10
*.host[*].wlan[0].mac.useAck = true
*.host[*].wlan[0].mac.fullDuplex = false
*.host[*].wlan[0].radio.transmitter.communicationRange = 200m
*.host[*].wlan[0].radio.receiver.ignoreInterference = false
*.host[*].wlan[0].radio.transmitter.interferenceRange = 250m
*.host[*].wlan[0].mac.headerLength = 23B

*.host[*].hasStatus = true
*.host[*].wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
*.host[*].wlan[0].radio.energyConsumer.offPowerConsumption = 0mW
*.host[*].wlan[0].radio.energyConsumer.sleepPowerConsumption = 1mW
*.host[*].wlan[0].radio.energyConsumer.switchingPowerConsumption = 1mW
*.host[*].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 2mW
*.host[*].wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 5mW
*.host[*].wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 10mW
*.host[*].wlan[0].radio.energyConsumer.transmitterIdlePowerConsumption = 2mW
*.host[*].wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 100mW
*.host[*].energyStorage.typename = "SimpleEpEnergyStorage"
*.host[*].energyStorage.nominalCapacity = 0.2J # maximum capacity
*.host[*].energyStorage.initialCapacity = 0.2J
*.host[*].energyManagement.typename = "SimpleEpEnergyManagement"
*.host[*].energyManagement.nodeStartCapacity = 0.0001J # start threshold
*.host[*].energyManagement.nodeShutdownCapacity = 0.0001J # shutdown threshold

*.host[*].**.bitrate = 1Mbps
*.host[*].forwarding = true
*.host[*].mobility.typename = "RandomWaypointMobility"
*.host[*].mobility.speed = uniform(50mps, 100mps)
*.host[*].mobility.waitTime = 100ms
*.host[*].mobility.constraintAreaMinX = 0m
*.host[*].mobility.constraintAreaMinY = 0m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxX = 1250m
*.host[*].mobility.constraintAreaMaxY = 1250m
*.host[*].mobility.constraintAreaMaxZ = 0m

*.host[*].wlan[0].radio.displayCommunicationRange = true
#*.host[*].wlan[0].radio.displayCommunicationRange = true
#*.host[*].wlan[0].radio.displayInterferenceRange = true

*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/><autoroute metric='errorRate'/></config>")
*.configurator.optimizeRoutes = false
*.host*.ipv4.routingTable.netmaskRoutes = ""
*.configurator.addStaticRoutes = false

