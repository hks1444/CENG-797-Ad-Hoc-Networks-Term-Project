# IEEE 802.11 + Dimensional PHY
*.radioMedium.typename = "Ieee80211DimensionalRadioMedium"
*.radioMedium.analogModel.typename = "DimensionalAnalogModel"
*.radioMedium.backgroundNoise.power = -120dBm
*.host[*].wlan[0].radio.typename = "Ieee80211DimensionalRadio"
*.host[*].wlan[0].radio.transmitter.power = 2mW
*.host[*].wlan[0].radio.transmitter.centerFrequency = 2.412GHz
*.host[*].wlan[0].radio.transmitter.bandwidth = 20MHz
*.host[*].wlan[0].radio.receiver.sensitivity = -90dBm
*.host[*].wlan[0].radio.receiver.snirThreshold = 4dB
*.host[*].wlan[0].radio.receiver.ignoreInterference = false
*.host[*].wlan[0].mac.rateControl.typename = "ConstantRateControl"
*.host[*].wlan[0].mac.rateControl.dataRate = 6Mbps
*.host[*].wlan[0].mac.rateControl.multicastRate = 6Mbps

