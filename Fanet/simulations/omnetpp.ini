*.host[*].wlan[0].queue.typename = "DropTailQueue"
*.host[*].wlan[0].queue.packetCapacity = 10

*.host[*].hasStatus = true
*.host[*].wlan[0].radio.energyConsumer.typename = "StateBasedEpEnergyConsumer"
*.host[*].wlan[0].radio.energyConsumer.offPowerConsumption = 0mW
*.host[*].wlan[0].radio.energyConsumer.sleepPowerConsumption = 1mW
*.host[*].wlan[0].radio.energyConsumer.switchingPowerConsumption = 1mW
*.host[*].wlan[0].radio.energyConsumer.receiverIdlePowerConsumption = 2mW
*.host[*].wlan[0].radio.energyConsumer.receiverBusyPowerConsumption = 5mW
*.host[*].wlan[0].radio.energyConsumer.receiverReceivingPowerConsumption = 10mW
*.host[*].wlan[0].radio.energyConsumer.transmitterIdlePowerConsumption = 2mW
*.host[*].wlan[0].radio.energyConsumer.transmitterTransmittingPowerConsumption = 100mW
*.host[*].energyStorage.typename = "SimpleEpEnergyStorage"
*.host[*].energyStorage.nominalCapacity = 2J # maximum capacity
*.host[*].energyStorage.initialCapacity = 2J
*.host[*].energyManagement.typename = "SimpleEpEnergyManagement"
*.host[*].energyManagement.nodeStartCapacity = 0.0001J # start threshold
*.host[*].energyManagement.nodeShutdownCapacity = 0.0001J # shutdown threshold

#*.host[*].**.bitrate = 1Mbps
*.host[*].**.bitrate = 6Mbps
*.host[*].forwarding = true

*.host[*].mobility.constraintAreaMinX = 0m
*.host[*].mobility.constraintAreaMinY = 0m
*.host[*].mobility.constraintAreaMinZ = 0m
*.host[*].mobility.constraintAreaMaxX = 1250m
*.host[*].mobility.constraintAreaMaxY = 1250m
*.host[*].mobility.constraintAreaMaxZ = 0m
*.host[*].mobility.initialX = uniform(100m, 1150m)
*.host[*].mobility.initialY = uniform(100m, 1150m)
*.host[*].wlan[0].radio.displayCommunicationRange = true
#*.host[*].wlan[0].radio.displayCommunicationRange = true
#*.host[*].wlan[0].radio.displayInterferenceRange = true

*.configurator.config = xml("<config><interface hosts='**' address='10.0.0.x' netmask='255.255.255.0'/></config>")
*.configurator.addDefaultRoutes = false
*.configurator.addStaticRoutes = false
*.configurator.optimizeRoutes = false
*.host*.ipv4.routingTable.netmaskRoutes = ""

*.linkVisualizer.*.displayLinks = false
# *.visualizer.*.displayTransportConnections = true
# *.visualizer.*.displayRoutingTables = true